<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Irregular Cards</title>

    <link rel="stylesheet" href="assets/styles/variables.css">
    <link rel="stylesheet" href="assets/styles/style.css">

</head>


<body>


<header>

    <h1>Irregular Cards</h1>

    <p>Apprends les verbes irréguliers en jouant</p>

</header>



<main>


<div class="card-container">


    <div class="card" id="card">


        <!-- RECTO -->

        <div class="card-face card-front">


            <span class="level">
                LEVEL 1
            </span>


            <h2>GO</h2>


            <button class="sound" id="sound">
                🔊
            </button>


            <p>
                Clique pour retourner la carte
            </p>


        </div>




        <!-- VERSO -->


        <div class="card-face card-back">


            <h2>GO</h2>


            <div class="forms">

                <p>
                    Prétérit :
                    <strong>WENT</strong>
                </p>


                <p>
                    Participe :
                    <strong>GONE</strong>
                </p>


            </div>


            <p class="translation">
                Aller
            </p>


        </div>


    </div>


</div>


</main>


<script src="assets/JS/script.js"></script>


</body>

</html>
