<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Traversée de la Manche</title>

    <link
        rel="icon"
        type="image/svg+xml"
        href="assets/images/icones/delfaviconerror.svg"
    >

    <link rel="stylesheet" href="assets/styles/variables.css">
    <link rel="stylesheet" href="assets/styles/style.css">
    <link rel="stylesheet" href="assets/styles/professeur.css">
    <link rel="stylesheet" href="assets/styles/boat.css">
    <link rel="stylesheet" href="assets/styles/departure.css">
    <link rel="stylesheet" href="assets/styles/arrival.css">
    <link rel="stylesheet" href="assets/styles/crossing.css">
    <link rel="stylesheet" href="assets/styles/seagulls.css">
    <link rel="stylesheet" href="assets/styles/classroom.css">
    <link rel="stylesheet" href="assets/styles/postcard.css">
    <link rel="stylesheet" href="assets/styles/quiz.css">
    <link rel="stylesheet" href="assets/styles/login.css">
    <link rel="stylesheet" href="assets/styles/responsive.css">
    <link rel="stylesheet" href="assets/styles/responsive-classroom.css">

</head>

<body>


    <!-- =====================================================
         ORIENTATION MOBILE
    ====================================================== -->

    <div
        class="orientation-warning"
        id="orientation-warning"
    >

        <div class="orientation-warning__content">

            <div
                class="orientation-warning__phone"
                aria-hidden="true"
            >
                ↻
            </div>

            <p>
                Tournez votre appareil en mode paysage
            </p>

        </div>

    </div>


    <!-- =====================================================
         ÉCRAN TROP PETIT
    ====================================================== -->

    <div
        class="screen-too-small"
        id="screen-too-small"
    >

        <div class="screen-too-small__content">

            <h2>
                Écran trop petit
            </h2>

            <p>
                Cette application nécessite un écran
                d'au moins 768 × 493 pixels.
            </p>

        </div>

    </div>


    <!-- =====================================================
         CONNEXION
    ====================================================== -->

    <div
        class="login-modal"
        id="login-modal"
        aria-hidden="false"
    >

        <div class="login-modal__content">

            <h2>
                Connexion
            </h2>

            <form id="login-form">

                <div class="login-field">

                    <label for="login-email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        name="email"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="login-field">

                    <label for="login-password">
                        Mot de passe
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <p
                    class="login-error"
                    id="login-error"
                    aria-live="polite"
                ></p>

                <button
                    class="login-button"
                    id="login-button"
                    type="submit"
                >
                    Se connecter
                </button>

            </form>

        </div>

    </div>


    <!-- =====================================================
         DÉPART
    ====================================================== -->

    <section
        class="postcard-screen"
        id="departure-screen"
    >

        <div class="postcard-container">


            <!-- =================================================
                 DÉCONNEXION
            ================================================== -->

            <button
                class="logout-button"
                id="logout-button"
                type="button"
                hidden
            >
                Déconnexion
            </button>


            <img
                class="postcard"
                src="assets/images/decor/cartepostaledepart.png"
                alt="Carte postale de départ"
                draggable="false"
            >


            <button
                class="learning-hotspot"
                id="learning-button"
                type="button"
                aria-label="Ouvrir l'apprentissage"
            ></button>


            <img
                class="postcard-seagull postcard-seagull--departure"
                src="assets/images/decor/mouette3.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >


            <object
                class="postcard-professor postcard-professor--neutral"
                id="professeur-depart"
                data="assets/images/decor/personnages/professeur_pasgif_animation_neutre.svg"
                type="image/svg+xml"
                aria-label="Professeur prêt pour le départ"
            ></object>


            <button
                class="quiz-hotspot"
                id="quiz-button"
                type="button"
                aria-label="Lancer le quiz"
            ></button>

        </div>

    </section>


    <!-- =====================================================
         MODALE PRÉPARATION DU QUIZ
    ====================================================== -->

    <div
        class="quiz-modal"
        id="quiz-modal"
        aria-hidden="true"
    >

        <div class="quiz-modal__content">

            <h2>
                Prépare ton quiz
            </h2>

            <p>
                Choisis ton niveau.
            </p>


            <div class="quiz-difficulty">

                <h3>
                    Difficulté
                </h3>

                <div class="quiz-difficulty__choices">

                    <button
                        type="button"
                        data-difficulty="easy"
                    >
                        Facile
                    </button>

                    <button
                        type="button"
                        data-difficulty="medium"
                    >
                        Moyen
                    </button>

                    <button
                        type="button"
                        data-difficulty="hard"
                    >
                        Difficile
                    </button>

                </div>

            </div>


            <button
                class="quiz-start-button"
                id="quiz-start-button"
                type="button"
                disabled
            >
                Démarrer le quiz
            </button>

        </div>

    </div>


    <!-- =====================================================
         CLASSE
    ====================================================== -->

    <section
        class="classroom-screen"
        id="classroom-screen"
    >

        <img
            class="classroom-image"
            src="assets/images/decor/carteclasse.png"
            alt="Classe d'apprentissage des verbes irréguliers"
            draggable="false"
        >


        <!-- =================================================
             PROFESSEUR
        ================================================== -->

        <object
            class="classroom-professor"
            id="professeur-classe"
            data="assets/images/decor/personnages/professeur_pasgif_animation_neutre.svg"
            type="image/svg+xml"
            aria-label="Professeur"
        ></object>


        <!-- =================================================
             TABLEAU
        ================================================== -->

        <div class="classroom-board">

            <h2
                class="classroom-board__title"
                id="classroom-verb-title"
            >
                TO CLING
            </h2>

            <p
                class="classroom-board__translation"
                id="classroom-verb-translation"
            >
                s'accrocher
            </p>


            <div class="classroom-board__verb">

                <span id="classroom-verb-infinitive">
                    CLING
                </span>

                <span id="classroom-verb-preterite">
                    CLUNG
                </span>

                <span id="classroom-verb-participle">
                    CLUNG
                </span>

            </div>


            <!-- =============================================
                 NAVIGATION DES VERBES
            ============================================== -->

            <div class="classroom-learning-controls">

                <button
                    type="button"
                    id="classroom-previous-verb"
                >
                    Précédent
                </button>

                <span id="classroom-verb-counter">
                    1 / 1
                </span>

                <button
                    type="button"
                    id="classroom-next-verb"
                >
                    Suivant
                </button>

            </div>

        </div>


        <!-- =================================================
             BOUTON SORTIR
        ================================================== -->

        <button
            class="classroom-back-button"
            id="classroom-back-button"
            type="button"
        >
            Sortir
        </button>


        <!-- =================================================
             BOUTON EXERCICE
        ================================================== -->

        <button
            class="classroom-exercise-button"
            id="classroom-exercise-button"
            type="button"
        >
            Exercice
        </button>


        <!-- =================================================
             BOUTON RETOUR APPRENTISSAGE
        ================================================== -->

        <button
            class="classroom-learning-button"
            id="classroom-learning-button"
            type="button"
            hidden
        >
            Apprentissage
        </button>

    </section>


    <!-- =====================================================
         TRAVERSÉE
    ====================================================== -->

    <main
        class="sea-scene"
        id="crossing-screen"
    >

        <video
            class="sea-video"
            autoplay
            muted
            loop
            playsinline
            aria-hidden="true"
        >

            <source
                src="assets/videos/mer1.mp4"
                type="video/mp4"
            >

        </video>


        <img
            class="sea-overlay"
            src="assets/images/decor/image_fond_sans_mer.png"
            alt=""
            aria-hidden="true"
            draggable="false"
        >


        <!-- =================================================
             CHRONOMÈTRE
        ================================================== -->

        <div
            class="quiz-clock"
            id="quiz-clock"
            role="timer"
            aria-live="polite"
            aria-label="Temps restant"
        >

            <div class="quiz-clock__marks"></div>

            <div
                class="quiz-clock__hand"
                id="quiz-clock-hand"
            ></div>

            <div class="quiz-clock__center"></div>

            <span
                class="quiz-clock__value"
                id="quiz-timer"
            >
                20
            </span>

        </div>


        <!-- =================================================
             QUESTION
        ================================================== -->

        <div
            class="quiz-question"
            id="quiz-question"
        >

            <p
                class="quiz-question__number"
                id="quiz-question-number"
            >
                Question
            </p>

            <p
                class="quiz-question__text"
                id="quiz-question-text"
            >
                Question
            </p>

            <div
                class="quiz-question__answers"
                id="quiz-question-answers"
            ></div>

        </div>


        <!-- =================================================
             MOUETTES
        ================================================== -->

        <div class="seagull-flight seagull-flight--1">

            <img
                class="seagull"
                src="assets/images/decor/mouette1.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <div class="seagull-flight seagull-flight--9">

            <img
                class="seagull"
                src="assets/images/decor/mouette9.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <!-- =================================================
             BOUTON TECHNIQUE DU BATEAU
        ================================================== -->

        <button
            class="sea-scene__button quiz-crossing-button"
            id="start-crossing"
            type="button"
            aria-hidden="true"
            tabindex="-1"
        >
            Faire avancer le bateau
        </button>


        <!-- =================================================
             BATEAU
        ================================================== -->

        <div
            class="boat-translation"
            id="boat-translation"
        >

            <div
                class="boat-oscillation"
                id="boat-oscillation"
            >

                <div
                    class="boat-wake"
                    id="boat-wake"
                    aria-hidden="true"
                >

                    <img
                        class="boat-wake__image"
                        id="boat-wake-image"
                        src="assets/images/decor/vaguelette-sillage.png"
                        alt=""
                        draggable="false"
                    >

                </div>


                <img
                    class="boat"
                    id="boat"
                    src="assets/images/decor/boat.png"
                    alt="Petit bateau traversant la Manche"
                    draggable="false"
                >

            </div>

        </div>

    </main>


    <!-- =====================================================
         ARRIVÉE
    ====================================================== -->

    <section
        class="postcard-screen"
        id="arrival-screen"
    >

        <div class="postcard-container">


            <!-- =================================================
                 CARTE POSTALE
            ================================================== -->

            <img
                class="postcard"
                src="assets/images/decor/cartepostalearrivee.png"
                alt="Carte postale d'arrivée en Angleterre"
                draggable="false"
            >


            <!-- =================================================
                 ZONE CLIQUABLE DU RETOUR
            ================================================== -->

            <button
                class="arrival-return-hotspot"
                id="return-button"
                type="button"
                aria-label="Commencer le retour vers la France"
            ></button>


            <!-- =================================================
                 SCORE
            ================================================== -->

            <div
                class="arrival-score"
                id="arrival-score"
                aria-live="polite"
            >

                <p
                    class="arrival-score__value"
                    id="arrival-score-value"
                >
                    0 / 20
                </p>

            </div>


            <!-- =================================================
                 MOUETTE
            ================================================== -->

            <img
                class="postcard-seagull postcard-seagull--arrival"
                src="assets/images/decor/mouette3.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >


            <!-- =================================================
                 PROFESSEUR ARRIVÉE
            ================================================== -->

            <object
                class="postcard-professor postcard-professor--bravo"
                id="professeur-arrivee"
                data="assets/images/decor/personnages/professeur_pasgif_animation_bravo.svg"
                type="image/svg+xml"
                aria-label="Professeur"
            ></object>

        </div>

    </section>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="assets/JS/screen.js"></script>
    <script src="assets/JS/professeur.js"></script>
    <script src="assets/JS/boat.js"></script>
    <script src="assets/JS/quiz-timer.js"></script>
    <script src="assets/JS/api.js"></script>
    <script src="assets/JS/login.js"></script>
    <script src="assets/JS/quiz-game.js"></script>
    <script src="assets/JS/quiz.js"></script>
    <script src="assets/JS/classroom-learning.js"></script>
    <script src="assets/JS/classroom-training.js"></script>
    <script src="assets/JS/script.js"></script>

</body>

</html>
