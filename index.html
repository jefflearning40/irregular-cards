<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Traversée de la Manche</title>

    <link
        rel="stylesheet"
        href="assets/styles/variables.css"
    >

    <link
        rel="stylesheet"
        href="assets/styles/style.css"
    >

</head>

<body>


    <!-- ===========================
         CARTE DE DÉPART
    ============================ -->

    <section
        class="postcard-screen"
        id="departure-screen"
    >

        <!-- CARTE -->

        <img
            class="postcard"
            src="assets/images/decor/cartepostaledepart.png"
            alt="Carte postale de départ"
            draggable="false"
        >


        <!-- PROFESSEUR NEUTRE -->

        <object
            class="postcard-professor postcard-professor--neutral"
            id="professeur-depart"
            data="assets/images/decor/personnages/professeur_pasgif_animation_neutre.svg"
            type="image/svg+xml"
            aria-label="Professeur prêt pour le départ"
        ></object>


        <!-- BOUTON DÉPART -->

        <button
            class="postcard-button"
            id="departure-button"
            type="button"
        >
            Partir pour l'Angleterre
        </button>

    </section>


    <!-- ===========================
         TRAVERSÉE DE LA MANCHE
    ============================ -->

    <main
        class="sea-scene"
        id="crossing-screen"
    >

        <!-- ===========================
             TITRE
        ============================ -->

        <h1 class="sea-scene__title">
            Traversée de la Manche
        </h1>


        <!-- ===========================
             MOUETTE 1
        ============================ -->

        <div class="seagull-flight seagull-flight--1">

            <img
                class="seagull"
                src="assets/images/decor/mouette1.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <!-- ===========================
             MOUETTE 9
        ============================ -->

        <div class="seagull-flight seagull-flight--9">

            <img
                class="seagull"
                src="assets/images/decor/mouette9.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <!-- ===========================
             BOUTON TRAVERSÉE
        ============================ -->

        <button
            class="sea-scene__button"
            id="start-crossing"
            type="button"
        >
            Démarrer la traversée
        </button>


        <!-- ===========================
             BATEAU
        ============================ -->

        <div
            class="boat-translation"
            id="boat-translation"
        >

            <div
                class="boat-oscillation"
                id="boat-oscillation"
            >

                <img
                    class="boat"
                    id="boat"
                    src="assets/images/decor/boat_inkscape.svg"
                    alt="Petit bateau traversant la Manche"
                    draggable="false"
                >

            </div>

        </div>

    </main>


    <!-- ===========================
         CARTE D'ARRIVÉE
    ============================ -->

    <section
        class="postcard-screen"
        id="arrival-screen"
    >

        <!-- CARTE -->

        <img
            class="postcard"
            src="assets/images/decor/cartepostalearrivee.png"
            alt="Carte postale d'arrivée en Angleterre"
            draggable="false"
        >


        <!-- PROFESSEUR BRAVO -->

        <object
            class="postcard-professor postcard-professor--bravo"
            id="professeur-arrivee"
            data="assets/images/decor/personnages/professeur_pasgif_animation_bravo.svg"
            type="image/svg+xml"
            aria-label="Professeur félicitant l'élève"
        ></object>


        <!-- BOUTON RETOUR -->

        <button
            class="postcard-button"
            id="return-button"
            type="button"
        >
            Retour en France
        </button>

    </section>


    <!-- ===========================
         JAVASCRIPT
    ============================ -->

    <script src="assets/JS/script.js"></script>

</body>

</html>
