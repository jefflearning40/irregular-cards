<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Traversée de la Manche</title>
    <link rel="stylesheet" href="assets/styles/variables.css">
    <link rel="stylesheet" href="assets/styles/style.css" >
    <link rel="stylesheet" href="assets/styles/professeur.css"  >
    <link rel="stylesheet" href="assets/styles/boat.css"  >
    <link rel="stylesheet" href="assets/styles/departure.css"  >
    <link rel="stylesheet" href="assets/styles/arrival.css"   >
    <link rel="stylesheet" href="assets/styles/crossing.css"   >
    <link rel="stylesheet" href="assets/styles/seagulls.css"   >
    <link rel="stylesheet" href="assets/styles/classroom.css"    >
    <link rel="stylesheet" href="assets/styles/postcard.css">   
    <link rel="stylesheet" href="assets/styles/quiz.css" >
    <link rel="stylesheet" href="assets/styles/responsive.css" >

</head>

<body>

    <!-- ===========================
         CARTE DE DÉPART
    ============================ -->

    <section
        class="postcard-screen"
        id="departure-screen"
    >

        <img
            class="postcard"
            src="assets/images/decor/cartepostaledepart.png"
            alt="Carte postale de départ"
            draggable="false"
        >


        <!-- ZONE APPRENTISSAGE -->

        <button
            class="learning-hotspot"
            id="learning-button"
            type="button"
            aria-label="Ouvrir l'apprentissage"
        ></button>


        <!-- MOUETTE -->

        <img
            class="postcard-seagull postcard-seagull--departure"
            src="assets/images/decor/mouette3.gif"
            alt=""
            aria-hidden="true"
            draggable="false"
        >


        <!-- PROFESSEUR -->

        <object
            class="postcard-professor postcard-professor--neutral"
            id="professeur-depart"
            data="assets/images/decor/personnages/professeur_pasgif_animation_neutre.svg"
            type="image/svg+xml"
            aria-label="Professeur prêt pour le départ"
        ></object>


        <!-- ZONE QUIZ -->

<button
    class="quiz-hotspot"
    id="quiz-button"
    type="button"
    aria-label="Lancer le quiz"
></button>

    </section>

    <!-- ===========================
     MODALE DE CONFIGURATION DU QUIZ
    ============================ -->

<div
    class="quiz-modal"
    id="quiz-modal"
    aria-hidden="true"
>
    <div class="quiz-modal__content">

        <h2>
            Prépare ta traversée
        </h2>

        <p>
            Choisis ton niveau et ton type de questions.
        </p>
        <div class="quiz-difficulty">

    <h3>
        Difficulté
    </h3>

    <div class="quiz-difficulty__choices">

        <button
            type="button"
            data-difficulty="easy"
        >
            Facile
        </button>

        <button
            type="button"
            data-difficulty="medium"
        >
            Moyen
        </button>

        <button
            type="button"
            data-difficulty="hard"
        >
            Difficile
        </button>

    </div>
    <div class="quiz-type">

    <h3>
        Type de questions
    </h3>

    <div class="quiz-type__choices">

        <button
            type="button"
            data-quiz-type="preterite"
        >
            Trouver le prétérit
        </button>

        <button
            type="button"
            data-quiz-type="infinitive"
        >
            Trouver l'infinitif
        </button>

        <button
            type="button"
            data-quiz-type="translation"
        >
            Traduction
        </button>

    </div>
    <button
    class="quiz-start-button"
    id="quiz-start-button"
    type="button"
    disabled
>
    Commencer la traversée
</button>

</div>
    

</div>

    </div>
</div>


    <!-- ===========================
         CLASSE / APPRENTISSAGE
    ============================ -->

    <section
        class="classroom-screen"
        id="classroom-screen"
    >

        <img
            class="classroom-image"
            src="assets/images/decor/carteclasse.png"
            alt="Classe d'apprentissage des verbes irréguliers"
            draggable="false"
        >

        <button
            class="classroom-back-button"
            id="classroom-back-button"
            type="button"
        >
            Retour
        </button>

    </section>


    <!-- ===========================
         TRAVERSÉE
    ============================ -->

    <main
        class="sea-scene"
        id="crossing-screen"
    >

        <video
            class="sea-video"
            autoplay
            muted
            loop
            playsinline
            aria-hidden="true"
        >

            <source
                src="assets/videos/mer1.mp4"
                type="video/mp4"
            >

        </video>


        <img
            class="sea-overlay"
            src="assets/images/decor/image_fond_sans_mer.png"
            alt=""
            aria-hidden="true"
            draggable="false"
        >


        <h1 class="sea-scene__title">
            Traversée de la Manche
        </h1>


        <div class="seagull-flight seagull-flight--1">

            <img
                class="seagull"
                src="assets/images/decor/mouette1.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <div class="seagull-flight seagull-flight--9">

            <img
                class="seagull"
                src="assets/images/decor/mouette9.gif"
                alt=""
                aria-hidden="true"
                draggable="false"
            >

        </div>


        <button
            class="sea-scene__button"
            id="start-crossing"
            type="button"
        >
            Démarrer la traversée
        </button>


        <div
            class="boat-translation"
            id="boat-translation"
        >

            <div
                class="boat-oscillation"
                id="boat-oscillation"
            >

                <div
                    class="boat-wake"
                    id="boat-wake"
                    aria-hidden="true"
                >

                    <img
                        class="boat-wake__image"
                        id="boat-wake-image"
                        src="assets/images/decor/vaguelette-sillage.png"
                        alt=""
                        draggable="false"
                    >

                </div>


                <img
                    class="boat"
                    id="boat"
                    src="assets/images/decor/boat.png"
                    alt="Petit bateau traversant la Manche"
                    draggable="false"
                >

            </div>

        </div>

    </main>


    <!-- ===========================
         CARTE D'ARRIVÉE
    ============================ -->

    <section
        class="postcard-screen"
        id="arrival-screen"
    >

        <img
            class="postcard"
            src="assets/images/decor/cartepostalearrivee.png"
            alt="Carte postale d'arrivée en Angleterre"
            draggable="false"
        >


        <img
            class="postcard-seagull postcard-seagull--arrival"
            src="assets/images/decor/mouette3.gif"
            alt=""
            aria-hidden="true"
            draggable="false"
        >


        <object
            class="postcard-professor postcard-professor--bravo"
            id="professeur-arrivee"
            data="assets/images/decor/personnages/professeur_pasgif_animation_bravo.svg"
            type="image/svg+xml"
            aria-label="Professeur félicitant l'élève"
        ></object>


        <button
            class="postcard-button"
            id="return-button"
            type="button"
        >
            Retour en France
        </button>

    </section>


    <script src="assets/JS/screen.js"></script>
    <script src="assets/JS/professeur.js"></script>
    <script src="assets/JS/boat.js"></script>
    <script src="assets/JS/quiz.js"></script>
    <script src="assets/JS/script.js"></script>

</body>

</html>
